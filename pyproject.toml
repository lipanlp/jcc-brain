[project]
license = "GPL-3.0-only"
name = "jccbrain"
version = "0.1.0"
description = "金铲铲大脑：金铲铲之战 AI 分析决策与自动化工具（macOS）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pywebview>=5.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-ScreenCaptureKit>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "rapidocr-onnxruntime>=1.4,<2",      # 视觉 OCR 默认后端（PP-OCRv4，onnxruntime CPU）
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'"]
build = ["pyinstaller>=6.6"]

[project.scripts]
jcc = "jccbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jccbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
